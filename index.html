    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      color: #1f1f1f;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;

    h1 { margin: 0 0 0.35rem; font-size: 1.9rem; }
    p { margin: 0; color: #5f5f5f; line-height: 1.6; }
    ul { display: grid; gap: 1rem; margin: 2rem 0 0; padding: 0; list-style: none; }
    a {
      display: grid;
      gap: 0.35rem;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: #fff;
      color: inherit;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
    }
    a:hover { border-color: #1f1f1f; }
    a:focus-visible { outline: 2px solid #1f1f1f; outline-offset: 2px; }
    strong { font-size: 1.2rem; }
    small { color: #767676; font-size: 0.85rem; }
  </style>
</head>

  <main>

          <small>greybox-v1</small>
        </a>
      </li>
      <li>
        <a href="design/">
          <strong>גרסת עיצוב</strong>
          <p>שלב העיצוב, בעבודה. מתעדכנת עם ענף design.</p>
          <small>design</small>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
